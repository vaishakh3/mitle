<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161226"/>
      <stop offset="1" stop-color="#0D0A16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E85D75" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E85D75" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B8C6"/>
      <stop offset="0.45" stop-color="#E85D75"/>
      <stop offset="1" stop-color="#C74560"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#night)"/>

  <!-- stars -->
  <g fill="#F2B8C6">
    <circle cx="96" cy="52" r="2" opacity="0.7"/>
    <circle cx="210" cy="120" r="1.5" opacity="0.4"/>
    <circle cx="320" cy="48" r="1.5" opacity="0.5"/>
    <circle cx="452" cy="90" r="2" opacity="0.35"/>
    <circle cx="565" cy="38" r="1.5" opacity="0.6"/>
    <circle cx="675" cy="105" r="2" opacity="0.4"/>
    <circle cx="760" cy="56" r="1.5" opacity="0.65"/>
    <circle cx="150" cy="250" r="1.5" opacity="0.4"/>
    <circle cx="300" cy="296" r="2" opacity="0.5"/>
    <circle cx="520" cy="268" r="1.5" opacity="0.4"/>
    <circle cx="700" cy="300" r="1.5" opacity="0.55"/>
    <circle cx="820" cy="240" r="2" opacity="0.35"/>
    <circle cx="60" cy="160" r="1.5" opacity="0.5"/>
    <circle cx="890" cy="130" r="1.5" opacity="0.45"/>
  </g>

  <!-- wax seal -->
  <circle cx="1020" cy="170" r="150" fill="url(#glow)"/>
  <circle cx="1020" cy="170" r="86" fill="url(#seal)"/>
  <circle cx="1020" cy="170" r="70" fill="none" stroke="#F4EDE3" stroke-opacity="0.55" stroke-width="2"/>
  <text x="1020" y="196" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="72" fill="#F4EDE3">mc</text>

  <!-- wordmark -->
  <text x="80" y="118" font-family="Verdana, Geneva, sans-serif" font-size="15" letter-spacing="6" font-weight="bold" fill="#E85D75">A DATING APP, BARELY</text>
  <text x="74" y="212" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="92" fill="#F4EDE3">Meet<tspan font-style="italic" fill="#F2B8C6">Cute.</tspan></text>
  <text x="80" y="266" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#C9BFD6">One stranger a day. One cafe. One hour. Then it's gone.</text>
</svg>
